<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b08">
<meta name="color-scheme" content="dark">
<title>{% block title %}Attacksoft Analysis{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
{% block head_extra %}{% endblock %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='theme-v2.css') }}">
<style>
.nav-intel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 6px 12px;
  color: var(--ink-muted, #8a9a8a);
  text-decoration: none;
  border: 1px solid rgba(160, 255, 112, 0.12);
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.2);
  transition: all .2s ease;
}
.nav-intel:hover {
  color: var(--accent, #a0ff70);
  border-color: rgba(160, 255, 112, 0.35);
  background: rgba(160, 255, 112, 0.03);
}
.nav-intel .arrow {
  font-size: 0.72rem;
  opacity: 0.5;
  transition: opacity .2s ease, transform .2s ease;
}
.nav-intel:hover .arrow {
  opacity: 1;
  transform: translateX(2px);
}
.nav-intel .compass {
  display: inline-block;
  vertical-align: -2px;
  color: inherit;
}
.nav-intel .compass-needle {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.1s linear;
}
.nav-intel.spinning .compass-needle {
  animation: compass-spin 0.35s linear infinite;
  transition: none;
}
@keyframes compass-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .nav-intel .compass-needle { transition: none; }
  .nav-intel.spinning .compass-needle { animation: none; }
}
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="bg-grid" aria-hidden="true"></div>

<header class="site-head">
  <div class="wrap head-in">
    <a class="brand" href="/intel">
      <span class="mark" aria-hidden="true"></span>
      <span>Attacksoft<br><small>Behavioral Analysis</small></span>
    </a>
    <nav class="nav">
{% if intel_mode %}
  <a class="nav-intel" href="https://analyze.attacksoft.com/">
    <svg class="compass" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
      <circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <g class="compass-needle">
        <polygon points="10,2 11.5,10 10,10 8.5,10" fill="var(--accent, #a0ff70)" opacity="0.95"/>
        <polygon points="10,18 11.5,10 10,10 8.5,10" fill="currentColor" opacity="0.4"/>
      </g>
    </svg>
    Analyze Files
  </a>
{% else %}
  <a class="nav-intel" href="/intel">
    <svg class="compass" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
      <circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <g class="compass-needle">
        <polygon points="10,2 11.5,10 10,10 8.5,10" fill="var(--accent, #a0ff70)" opacity="0.95"/>
        <polygon points="10,18 11.5,10 10,10 8.5,10" fill="currentColor" opacity="0.4"/>
      </g>
    </svg>
    Threat Intel
  </a>
{% endif %}
      <a href="{{ url_for('privacy') }}">Privacy</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>

<footer class="site-foot">
  <div class="wrap foot-in">
    <span>Automated behavioral analysis. Results are advisory.</span>
    <span class="spacer"></span>
    <a href="{{ url_for('privacy') }}">Privacy &amp; retention</a>
  </div>
</footer>
<script>
(function () {
  var btn = document.querySelector('.nav-intel');
  if (!btn) return;
  var needle = btn.querySelector('.compass-needle');
  if (!needle) return;

  var cx = 0, cy = 0, hovered = false;

  function updateCenter() {
    var r = needle.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
  }
  updateCenter();
  window.addEventListener('scroll', updateCenter, { passive: true });
  window.addEventListener('resize', updateCenter, { passive: true });

  btn.addEventListener('mouseenter', function () {
    hovered = true;
    btn.classList.add('spinning');
  });
  btn.addEventListener('mouseleave', function (e) {
    hovered = false;
    btn.classList.remove('spinning');
    // snap needle to current cursor position so it doesn't jump
    var dx = e.clientX - cx, dy = e.clientY - cy;
    needle.style.transform = 'rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI + 90) + 'deg)';
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  document.addEventListener('mousemove', function (e) {
    if (hovered) return;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    needle.style.transform = 'rotate(' + angle + 'deg)';
  }, { passive: true });
})();
</script>

</body>
</html>
